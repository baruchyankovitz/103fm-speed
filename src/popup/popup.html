<!doctype html>
<html dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: Arial, sans-serif;
        width: 200px;
        margin: 12px;
        text-align: center;
      }
      h3 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      button {
        padding: 8px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font-size: 14px;
      }
      .credit {
        margin: 12px -12px -12px;
        padding: 8px;
        border-top: 1px solid #eee;
        font-size: 11px;
        color: #888;
      }
      .credit a {
        color: #d32f2f;
        text-decoration: none;
        font-weight: bold;
      }
      button.on {
        background: #d32f2f;
        color: #fff;
        border-color: #d32f2f;
      }
    </style>
  </head>
  <body>
    <h3>מהירות השמעה</h3>
    <div class="grid" id="g"></div>
    <p style="font-size: 11px; color: #666; margin: 10px 0 0; line-height: 1.6">
      Shift+&gt; / Shift+&lt; — מהירות<br />← / → — דילוג 10 שניות (Shift: 30)<br />רווח — השמעה/עצירה<br />P — נגן צף ·
      ? — כל הקיצורים
    </p>
    <div class="credit">
      פותח ע״י <a href="https://portfolio-upgrade-xi.vercel.app/" target="_blank" rel="noopener">ברוך ינקוביץ</a>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
